#quizContainer {

button {

    border-radius: 20px;

    cursor: pointer;

}
.dropdowns {

}
.options {

    flex-direction: column;

    margin: 15px auto;

}

.options label {
    font-size:18px;
   display:flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    
}
.options input[type="radio"] {
    transform: scale(1.2);

}
#quizContainer p {
    font-size: 20px;   /* increase as you like */
    font-weight: 600;

    
}
.question-block {
    background: linear-gradient(145deg, #020617, #0f172a);
    padding: 25px;
    margin: 20px 0;
    border-radius: 20px;
    width:100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    transition: 0.3s;
}

.question-block:hover {
    transform: translateY(-5px);
}
/* Question text */
.question-title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 15px;
    color: #e2e8f0;
}
/* 🔹 Navbar */
/* 🔹 Navbar Container */
.nav {
    position: relative;
    width:100%;
    display: flex;
    align-items: center;
    padding: 20px 40px;
    background: #0f172a;
}

/* 🔹 Logo (left) */
.logo {
    font-size: 22px;
    font-weight: bold;
    color: white;
}

.logo span {
    color: rgb(158, 59, 239);
}

/* 🔹 Center nav */
.navbar {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
}

.navbar ul {
    list-style: none;
    margin-right:20px;
    display: flex;
    gap: 40px;
}

.navbar a {
    text-decoration: none;
    color: #cbd5e1;
    font-size: 18px;
    transition: 0.3s;
}

.navbar li:hover {
    transform: scale(1.07);
}
.navbar a:hover{
    color:white;
}
.nav h1{
    font-size: 28px;
}
@media (max-width: 600px) {
    
    .nav{
        flex-direction: column;
        gap:10px;
        padding:15px 20px;
    }
    .navbar ul{
        gap:15px;
        font-size:12px;
        align-items: center;
    }

    .navbar li {
        margin-top:40px;
        justify-content: center;
       
    }

    .navbar a {
        font-size: 16px;
        padding: 10px 8px;      
        
        
    }
}
</style>

function loadTopics() {
    let course = document.getElementById("courseSelect").value;
    let topicSelect = document.getElementById("topicSelect");

    const topics = {
        frontend: ["HTML", "CSS", "Javascript"],
        backend: ["Python", "SQL"],
        fullstack: ["React", "Git", "Api"],
       datascience: ["Python", "Statistics", "Pandas", "Numpy"],
       aiml: ["Machine Learning", "Deep Learning", "Neural Networks", "NLP"],
        uiux: ["Figma", "Design"],
       cloud: ["AWS", "Azure", "GCP", "Cloud Basics"]
    };

    topicSelect.innerHTML = `<option value="">-- Select Topic --</option>`;

    if (!course) return;

    // ✅ use topics instead of data
    topics[course].forEach(topic => {
        topicSelect.innerHTML += `<option value="${topic}">${topic}</option>`;
    });
}

function loadQuestions() {
    let course = document.getElementById("courseSelect").value;
    let topic = document.getElementById("topicSelect").value;
    let container = document.getElementById("quizContainer");

    container.innerHTML = "";

    if (!course || !topic) return;

    data[course][topic].forEach((q, index) => {

        let html = `
        <div class="question-block">
            <p class="question-title">${index + 1}. ${q.question}</p>

            <div class="options">
        `;

        q.options.forEach(opt => {
            html += `
                <label>
                    <input type="radio" name="q${index}" value="${opt}">
                    ${opt}
                </label>
            `;
        });

        html += `
            </div>
        </div>
        `;

        container.innerHTML += html;
    });

    container.innerHTML += `<button onclick="submitQuiz()">Submit</button>`;
}
function submitQuiz() {
    let course = document.getElementById("courseSelect").value;
    let topic = document.getElementById("topicSelect").value;

    let questions = data[course][topic];
    let score = 0;

    questions.forEach((q, index) => {
        let selected = document.querySelector(`input[name="q${index}"]:checked`);
        if (selected && selected.value === q.answer) {
            score++;
        }
    });

    document.getElementById("result").innerText =
        "Score: " + score + "/" + questions.length;
}

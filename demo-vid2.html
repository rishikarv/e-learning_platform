<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Video</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;

      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center; /* center horizontally */
      justify-content: center;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    .video-container {
      width: 100%;
      max-width: 1000px;
    }

    .video-container iframe {
      width: 100%;
      height: 450px;
      border-radius: 12px;
      border: none;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Backend - Demo</h1>

  <div class="video-container">
      <iframe width="560" height="315" src="https://www.youtube.com/embed/_P4hnzTnK64?si=_4X_sR5kuo_aj1Ri" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>
</div>

</body>
</html>

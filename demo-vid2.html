<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Video</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;

      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh; /* FIX */
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 28px;
    }

    /* 🔥 RESPONSIVE VIDEO */
    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 ratio */
      height: 0;
      overflow: hidden;
      border-radius: 12px;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 12px;
    }

    /* 🔹 MOBILE */
    @media (max-width: 600px) {
      h1 {
        font-size: 22px;
      }

      body {
        align-items: flex-start; /* better spacing */
      }
    }

  </style>
</head>

<body>

<div class="container">
  <h1>Backend - Demo</h1>

  <div class="video-container">
      <iframe width="560" height="315" src="https://www.youtube.com/embed/_P4hnzTnK64?si=_4X_sR5kuo_aj1Ri" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>
</div>

</body>
</html>

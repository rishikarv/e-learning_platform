<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Assignment</title>
    <link rel="stylesheet" href="style-test.css">
</head>

<body>

    <!-- 🔹 Heading -->
    <header class="head">
        <h1>Backend Assignment Questions</h1>
    </header>

    <!-- 🔹 Main -->
    <main class="boxi">

        <form id="backendForm">

            <!-- 🔹 Q1 -->
            <div class="box">
                <label>
                    <strong>Q1. Build a Task Manager REST API</strong> 
                    <span style="color:#60a5fa;">(Beginner)</span>
                    <ul>
                        <li>Create APIs to add, update, delete and fetch tasks</li>
                        <li>Use HTTP methods (GET, POST, PUT, DELETE)</li>
                        <li>Return proper JSON responses</li>
                    </ul>
                </label>
                <input type="file" name="q1" required>
            </div>

            <!-- 🔹 Q2 -->
            <div class="box">
                <label>
                    <strong>Q2. Connect with MongoDB</strong> 
                    <span style="color:#34d399;">(Intermediate)</span>
                    <ul>
                        <li>Connect Node.js app with MongoDB using Mongoose</li>
                        <li>Create schema (title, description, status, date)</li>
                        <li>Perform CRUD operations</li>
                    </ul>
                </label>
                <input type="file" name="q2" required>
            </div>

            <!-- 🔹 Q3 -->
            <div class="box">
                <label>
                    <strong>Q3. User Authentication System</strong> 
                    <span style="color:#fbbf24;">(Intermediate)</span>
                    <ul>
                        <li>Create Signup & Login APIs</li>
                        <li>Hash passwords using bcrypt</li>
                        <li>Generate JWT token</li>
                        <li>Protect routes using middleware</li>
                    </ul>
                </label>
                <input type="file" name="q3" required>
            </div>

            <!-- 🔹 Q4 -->
            <div class="box">
                <label>
                    <strong>Q4. Role-Based Access Control</strong> 
                    <span style="color:#f87171;">(Advanced)</span>
                    <ul>
                        <li>Create roles: user & admin</li>
                        <li>Only admin can delete tasks</li>
                        <li>Use middleware for role validation</li>
                    </ul>
                </label>
                <input type="file" name="q4" required>
            </div>

            <!-- 🔹 Q5 -->
            <div class="box">
                <label>
                    <strong>Q5. Error Handling & Optimization</strong> 
                    <span style="color:#f87171;">(Advanced)</span>
                    <ul>
                        <li>Add global error handling middleware</li>
                        <li>Validate inputs properly</li>
                        <li>Handle 404 routes</li>
                        <li>Implement pagination for API</li>
                    </ul>
                </label>
                <input type="file" name="q5" required>
            </div>

            <!-- 🔹 BONUS -->
            <div class="box">
                <label>
                    <strong>Q6. Deploy Your Backend (Optional)</strong> 
                    <span style="color:#a78bfa;">(Bonus)</span>
                    <ul>
                        <li>Deploy on Render / Railway</li>
                        <li>Use environment variables (.env)</li>
                        <li>Test live API using Postman</li>
                    </ul>
                </label>
                <input type="file" name="q6">
            </div>

            <!-- 🔹 Checkbox -->
            <div class="checkbox-container">
                <input type="checkbox" id="check" required>
                <label for="check" class="checkfont">
                    All required questions are attempted.
                </label>
            </div>

            <!-- 🔹 Submit -->
            <div class="Submit">
                <button type="submit">Submit →</button>
            </div>

        </form>

    </main>

    <!-- 🔹 Script -->
    <script>
        document.getElementById("backendForm").addEventListener("submit", function(e) {
            e.preventDefault();

            alert("Backend assignment submitted successfully 🚀");

            this.reset();
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="signup-popup.css">
</head>
<style>
body {
    margin: 0;
    padding: 0;
    background-color: black;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.signup-page {
    width: 350px;
    background-color: #f5f5f5;
    padding: 30px;
    border-radius: 10px;
    text-align: center;

    box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
}


 h1 {
    color: #2c7be5;
    margin-bottom: 20px;
}

.input-box {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 20px;
    border: 1px solid #ccc;
    outline: none;
    font-size: 14px;
}


 p {
    font-size: 14px;
    text-align: left;
    margin: 10px 0;
}


#signupBtn {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 20px;
    background-color: #2c7be5;
    color: white;
    cursor: pointer;
    font-size: 15px;
}


#signupBtn:hover {
    background-color: #1a5fd0;
}

.signup-button{
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 20px;
    background-color: #2c7be5;
    color: white;
    cursor: pointer;
    font-size: 15px;

}
.signup-button{
    background-color: #1a5fd0;

}

.or {
    text-align: center;
    margin: 10px 0;
    color: gray;
}

hr {
    border: none;
    height: 1px;
    background: #ccc;
    margin: 15px 0;
}

a {
    color: #2c7be5;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

</style>
<body>
    <div class="signup-page">
        <h1>Sign Up Now</h1>

        <form>
            <input type="text" class="input-box" placeholder="Enter your Full Name" required>
            <input type="email" class="input-box" placeholder="Enter your Email" required>
            <input type="password" class="input-box" placeholder="Password" required minlength="6">
            <p>
                <input type="checkbox" required>I agree to the terms of services
            </p>
            <button type="submit" id="signupBtn" >Sign Up</button>
            <hr>
            <p class="or">OR</p>
            <button type="button" class="signup-button">Sign Up with Linkedin</button>
            <p>Already have an account? <a href="#">Login</a></p>
        </form>
    </div>

    <div id="popup" class="popup">

        <div class="popup-content">
            <h2>Welcome to InvoLearn 🎉</h2>
            <p>Your account has been created successfully!</p>
            <button id="closePopup">Continue</button>
        </div>
    </div>

    <script src="signup.js"></script>
</body>
</html>
